paths:
  processed_dataset: data/processed/features.csv
  model_path: models/rands_random_forest_filesystem.joblib
  log_dir: logs
monitor:
  watched_directories:
  - data/decoy
  poll_interval_seconds: 1.0
  window_seconds: 10.0
  min_events: 10
  enable_audit_attribution: true
features:
  names:
  - changed_file_count
  - file_access_breadth
  - directory_traversal_breadth
  - file_creation_count
  - file_deletion_count
  - extension_diversity
  - file_activity_total
  common_extensions:
  - .txt
  - .docx
  - .xlsx
  - .pdf
  - .csv
  - .png
  - .jpg
  - .py
  - .json
  - .log
model:
  n_estimators: 200
  max_depth: null
  random_state: 42
  test_size: 0.2
augmentation:
  enabled: true
  method: synthetic
  target_size: 200
  k_neighbors: 3
response:
  terminate_confidence_threshold: 0.625
  quarantine_confidence_threshold: 0.2
  mode: enforce
classification:
  benign_upper_threshold: 0.2
  ransomware_threshold: 0.625
